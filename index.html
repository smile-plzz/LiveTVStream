<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IPTV Stream</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.4.14/hls.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0b0d11;
    --surface: #12151c;
    --surface2: #1a1f2b;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.13);
    --text: #e8eaf0;
    --muted: #6b7280;
    --accent: #22d3a5;
    --accent-dim: rgba(34,211,165,0.12);
    --red: #f97068;
    --amber: #f5a623;
    --font: 'Space Grotesk', sans-serif;
    --mono: 'IBM Plex Mono', monospace;
    --radius: 10px;
  }
  html, body { background: var(--bg); color: var(--text); font-family: var(--font); height: 100vh; overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  header {
    display: flex; align-items: center; gap: 16px; padding: 0 20px;
    height: 52px; border-bottom: 1px solid var(--border);
    background: var(--surface); flex-shrink: 0;
  }
  .logo { font-family: var(--mono); font-size: 13px; font-weight: 500; color: var(--accent); letter-spacing: 0.04em; display: flex; align-items: center; gap: 8px; }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--red); animation: pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }
  .search-wrap { flex: 1; max-width: 340px; position: relative; }
  .search-wrap input {
    width: 100%; background: var(--bg); border: 1px solid var(--border2);
    border-radius: var(--radius); padding: 6px 12px 6px 32px;
    color: var(--text); font-family: var(--font); font-size: 13px; outline: none;
    transition: border-color 0.2s;
  }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-wrap input::placeholder { color: var(--muted); }
  .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px; pointer-events: none; }
  .filter-bar { display: flex; gap: 6px; align-items: center; margin-left: auto; }
  select {
    background: var(--bg); border: 1px solid var(--border2); border-radius: 7px;
    color: var(--text); font-family: var(--font); font-size: 12px; padding: 5px 10px;
    outline: none; cursor: pointer;
  }
  select option { background: #1a1f2b; }
  select:focus { border-color: var(--accent); }
  .tag { font-family: var(--mono); font-size: 11px; color: var(--muted); background: var(--surface2); border: 1px solid var(--border); border-radius: 5px; padding: 3px 8px; white-space: nowrap; }

  .main { display: flex; flex: 1; overflow: hidden; }

  .sidebar {
    width: 300px; flex-shrink: 0; border-right: 1px solid var(--border);
    display: flex; flex-direction: column; background: var(--surface); overflow: hidden;
  }
  .sidebar-tabs { display: flex; border-bottom: 1px solid var(--border); }
  .tab-btn {
    flex: 1; padding: 10px; font-family: var(--font); font-size: 12px;
    background: none; border: none; color: var(--muted); cursor: pointer;
    border-bottom: 2px solid transparent; transition: all 0.2s;
  }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-btn:hover:not(.active) { color: var(--text); }
  .channel-list { flex: 1; overflow-y: auto; padding: 8px; }
  .channel-list::-webkit-scrollbar { width: 4px; }
  .channel-list::-webkit-scrollbar-track { background: transparent; }
  .channel-list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

  .channel-item {
    display: flex; align-items: center; gap: 10px; padding: 9px 10px;
    border-radius: 8px; cursor: pointer; transition: background 0.15s;
    border: 1px solid transparent; margin-bottom: 2px;
  }
  .channel-item:hover { background: var(--surface2); }
  .channel-item.active { background: var(--accent-dim); border-color: rgba(34,211,165,0.25); }
  .ch-logo {
    width: 36px; height: 36px; border-radius: 6px; background: var(--surface2);
    object-fit: contain; flex-shrink: 0; border: 1px solid var(--border);
  }
  .ch-logo-fallback {
    width: 36px; height: 36px; border-radius: 6px; background: var(--surface2);
    border: 1px solid var(--border); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 11px; color: var(--muted); font-weight: 500;
  }
  .ch-info { flex: 1; min-width: 0; }
  .ch-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
  .ch-meta { display: flex; gap: 5px; margin-top: 3px; align-items: center; flex-wrap: wrap; }
  .ch-tag { font-size: 10px; font-family: var(--mono); color: var(--muted); background: var(--bg); border: 1px solid var(--border); padding: 1px 5px; border-radius: 4px; }
  .ch-quality { font-size: 10px; font-family: var(--mono); }
  .q-hd { color: var(--accent); }
  .q-sd { color: var(--amber); }

  .player-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
  .video-wrap { position: relative; background: #000; flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; min-height: 0; }
  #video { width: 100%; height: 100%; object-fit: contain; display: block; }
  .overlay-idle { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 12px; pointer-events: none; }
  .idle-icon { font-size: 40px; }
  .idle-text { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .loading-overlay {
    position: absolute; inset: 0; background: rgba(0,0,0,0.6);
    display: none; align-items: center; justify-content: center; flex-direction: column; gap: 12px;
  }
  .spinner { width: 32px; height: 32px; border: 2px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-overlay {
    position: absolute; inset: 0; background: rgba(0,0,0,0.75);
    display: none; align-items: center; justify-content: center; flex-direction: column; gap: 10px;
  }
  .error-msg { font-family: var(--mono); font-size: 12px; color: var(--red); text-align: center; max-width: 300px; line-height: 1.6; }
  .dismiss-btn {
    margin-top: 8px; font-family: var(--mono); font-size: 11px; padding: 6px 14px;
    border-radius: 6px; background: var(--surface2); border: 1px solid var(--border2);
    color: var(--muted); cursor: pointer; transition: color 0.2s, border-color 0.2s;
  }
  .dismiss-btn:hover { color: var(--text); border-color: var(--accent); }

  .now-playing {
    padding: 10px 20px; border-top: 1px solid var(--border); background: var(--surface);
    display: flex; align-items: center; gap: 16px; flex-shrink: 0;
  }
  .np-logo { width: 40px; height: 40px; border-radius: 6px; object-fit: contain; background: var(--surface2); border: 1px solid var(--border); }
  .np-logo-fallback {
    width: 40px; height: 40px; border-radius: 6px; background: var(--surface2);
    border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 12px; color: var(--muted);
  }
  .np-info { flex: 1; min-width: 0; }
  .np-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .np-sub { font-size: 11px; font-family: var(--mono); color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .np-badge { font-size: 10px; font-family: var(--mono); padding: 3px 8px; border-radius: 4px; border: 1px solid; white-space: nowrap; }
  .badge-live { color: var(--red); border-color: rgba(249,112,104,0.35); background: rgba(249,112,104,0.08); }
  .badge-idle { color: var(--muted); border-color: var(--border); background: transparent; }

  .loading-state { display: flex; align-items: center; justify-content: center; height: 100%; flex-direction: column; gap: 14px; }
  .load-text { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .sidebar-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px 4px; }
  .sidebar-header span { font-family: var(--mono); font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">
      <div class="live-dot"></div>
      IPTV.STREAM
    </div>
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input type="text" id="searchInput" placeholder="Search channels…" />
    </div>
    <div class="filter-bar">
      <select id="countryFilter">
        <option value="">All countries</option>
      </select>
      <select id="catFilter">
        <option value="">All categories</option>
      </select>
      <span class="tag" id="totalTag">Loading…</span>
    </div>
  </header>

  <div class="main">
    <div class="sidebar">
      <div class="sidebar-tabs">
        <button class="tab-btn active" data-tab="all">All</button>
        <button class="tab-btn" data-tab="hd">HD Only</button>
        <button class="tab-btn" data-tab="recent">Recent</button>
      </div>
      <div class="sidebar-header">
        <span id="channelCount">Loading…</span>
      </div>
      <div class="channel-list" id="channelList">
        <div class="loading-state">
          <div class="spinner"></div>
          <div class="load-text">Fetching channels…</div>
        </div>
      </div>
    </div>

    <div class="player-area">
      <div class="video-wrap" id="videoWrap">
        <div class="overlay-idle" id="idleOverlay">
          <div class="idle-icon">📺</div>
          <div class="idle-text">Select a channel to start watching</div>
        </div>
        <video id="video" controls playsinline></video>
        <div class="loading-overlay" id="loadingOverlay">
          <div class="spinner"></div>
          <div style="font-family:var(--mono);font-size:12px;color:var(--muted)">Connecting to stream…</div>
        </div>
        <div class="error-overlay" id="errorOverlay">
          <div style="font-size:36px">📡</div>
          <div class="error-msg" id="errorMsg">Stream unavailable or geo-blocked</div>
          <button class="dismiss-btn" id="dismissBtn">Dismiss</button>
        </div>
      </div>

      <div class="now-playing">
        <div class="np-logo-fallback" id="npLogoFallback">TV</div>
        <img id="npLogo" class="np-logo" style="display:none" alt="" />
        <div class="np-info">
          <div class="np-title" id="npTitle">No channel selected</div>
          <div class="np-sub" id="npSub">—</div>
        </div>
        <div class="np-badge badge-idle" id="npBadge">IDLE</div>
      </div>
    </div>
  </div>
</div>

<script>
const M3U_URL = 'https://iptv-org.github.io/iptv/index.m3u';

let allChannels = [];
let recentChannels = [];
let activeTab = 'all';
let currentHls = null;
let currentChannel = null;

async function fetchM3U(url) {
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  const text = await resp.text();
  return parseM3U(text);
}

function parseM3U(text) {
  const lines = text.split('\n');
  const channels = [];
  let current = null;
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (line.startsWith('#EXTINF:')) {
      current = {};
      const nameMatch = line.match(/,(.+)$/);
      current.name = nameMatch ? nameMatch[1].trim() : 'Unknown';
      const logoMatch = line.match(/tvg-logo="([^"]*)"/);
      current.logo = logoMatch ? logoMatch[1] : '';
      const countryMatch = line.match(/tvg-country="([^"]*)"/);
      current.country = countryMatch ? countryMatch[1] : '';
      const langMatch = line.match(/tvg-language="([^"]*)"/);
      current.language = langMatch ? langMatch[1] : '';
      const groupMatch = line.match(/group-title="([^"]*)"/);
      current.category = groupMatch ? groupMatch[1] : 'General';
      const idMatch = line.match(/tvg-id="([^"]*)"/);
      current.id = idMatch ? idMatch[1] : '';
      const qMatch = line.match(/\b(1080p?|720p?|480p?|360p?)\b/i);
      current.quality = qMatch ? qMatch[1].toUpperCase() : '';
    } else if (line && !line.startsWith('#') && current) {
      current.url = line;
      channels.push(current);
      current = null;
    }
  }
  return channels;
}

function getInitials(name) {
  return name.split(' ').slice(0, 2).map(w => w[0] || '').join('').toUpperCase() || 'TV';
}

function isHD(ch) {
  const q = (ch.quality || '').toLowerCase();
  const n = (ch.name || '').toLowerCase();
  return q.includes('hd') || q.includes('720') || q.includes('1080') || n.includes(' hd') || n.endsWith(' hd') || n.includes('(hd)');
}

function buildCountryOptions(channels) {
  const countries = [...new Set(channels.map(c => c.country).filter(Boolean))].sort();
  const sel = document.getElementById('countryFilter');
  countries.forEach(c => {
    const o = document.createElement('option');
    o.value = c; o.textContent = c;
    sel.appendChild(o);
  });
}

function buildCategoryOptions(channels) {
  const cats = [...new Set(channels.map(c => c.category).filter(Boolean))].sort();
  const sel = document.getElementById('catFilter');
  cats.forEach(c => {
    const o = document.createElement('option');
    o.value = c; o.textContent = c;
    sel.appendChild(o);
  });
}

function renderChannels(channels) {
  const list = document.getElementById('channelList');
  document.getElementById('channelCount').textContent = channels.length.toLocaleString() + ' channels';
  if (!channels.length) {
    list.innerHTML = '<div style="padding:32px;text-align:center;font-family:var(--mono);font-size:12px;color:var(--muted)">No channels found</div>';
    return;
  }
  const frag = document.createDocumentFragment();
  channels.forEach(ch => {
    const item = document.createElement('div');
    item.className = 'channel-item' + (currentChannel === ch ? ' active' : '');
    const hdBadge = isHD(ch) ? `<span class="ch-quality q-hd">HD</span>` : ch.quality ? `<span class="ch-quality q-sd">${ch.quality}</span>` : '';
    if (ch.logo) {
      item.innerHTML = `
        <img class="ch-logo" src="${ch.logo}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <div class="ch-logo-fallback" style="display:none">${getInitials(ch.name)}</div>
        <div class="ch-info">
          <div class="ch-name">${ch.name}</div>
          <div class="ch-meta">
            ${ch.country ? `<span class="ch-tag">${ch.country}</span>` : ''}
            ${ch.category && ch.category !== 'General' ? `<span class="ch-tag">${ch.category}</span>` : ''}
            ${hdBadge}
          </div>
        </div>`;
    } else {
      item.innerHTML = `
        <div class="ch-logo-fallback">${getInitials(ch.name)}</div>
        <div class="ch-info">
          <div class="ch-name">${ch.name}</div>
          <div class="ch-meta">
            ${ch.country ? `<span class="ch-tag">${ch.country}</span>` : ''}
            ${ch.category && ch.category !== 'General' ? `<span class="ch-tag">${ch.category}</span>` : ''}
            ${hdBadge}
          </div>
        </div>`;
    }
    item.addEventListener('click', () => playChannel(ch, item));
    frag.appendChild(item);
  });
  list.innerHTML = '';
  list.appendChild(frag);
}

function applyFilters() {
  const search = document.getElementById('searchInput').value.toLowerCase().trim();
  const country = document.getElementById('countryFilter').value;
  const cat = document.getElementById('catFilter').value;
  let base = activeTab === 'hd' ? allChannels.filter(isHD)
           : activeTab === 'recent' ? recentChannels
           : allChannels;
  const filtered = base.filter(ch => {
    if (search && !ch.name.toLowerCase().includes(search) &&
        !(ch.category || '').toLowerCase().includes(search) &&
        !(ch.country || '').toLowerCase().includes(search)) return false;
    if (country && ch.country !== country) return false;
    if (cat && ch.category !== cat) return false;
    return true;
  });
  renderChannels(filtered);
}

function playChannel(ch, itemEl) {
  currentChannel = ch;
  document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
  if (itemEl) itemEl.classList.add('active');

  recentChannels = [ch, ...recentChannels.filter(c => c.url !== ch.url)].slice(0, 30);

  const npTitle = document.getElementById('npTitle');
  const npSub = document.getElementById('npSub');
  const npLogo = document.getElementById('npLogo');
  const npLogoFallback = document.getElementById('npLogoFallback');
  const npBadge = document.getElementById('npBadge');

  npTitle.textContent = ch.name;
  npSub.textContent = [ch.country, ch.category, ch.language].filter(Boolean).join(' · ') || ch.url;
  npBadge.className = 'np-badge badge-live';
  npBadge.textContent = 'LIVE';

  if (ch.logo) {
    npLogo.src = ch.logo;
    npLogo.style.display = 'block';
    npLogoFallback.style.display = 'none';
    npLogo.onerror = () => { npLogo.style.display = 'none'; npLogoFallback.style.display = 'flex'; npLogoFallback.textContent = getInitials(ch.name); };
  } else {
    npLogo.style.display = 'none';
    npLogoFallback.style.display = 'flex';
    npLogoFallback.textContent = getInitials(ch.name);
  }

  startStream(ch.url);
}

function startStream(url) {
  const video = document.getElementById('video');
  const loadingOverlay = document.getElementById('loadingOverlay');
  const errorOverlay = document.getElementById('errorOverlay');
  const idleOverlay = document.getElementById('idleOverlay');

  idleOverlay.style.display = 'none';
  errorOverlay.style.display = 'none';
  loadingOverlay.style.display = 'flex';

  if (currentHls) { currentHls.destroy(); currentHls = null; }
  video.removeAttribute('src');
  video.load();

  const onReady = () => { loadingOverlay.style.display = 'none'; };
  const onError = (msg) => {
    loadingOverlay.style.display = 'none';
    document.getElementById('errorMsg').textContent = msg || 'Stream unavailable or geo-blocked';
    errorOverlay.style.display = 'flex';
  };

  if (typeof Hls !== 'undefined' && Hls.isSupported()) {
    const hls = new Hls({
      enableWorker: false,
      lowLatencyMode: true,
      maxBufferLength: 30,
    });
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      onReady();
      video.play().catch(() => {});
    });
    hls.on(Hls.Events.ERROR, (e, data) => {
      if (data.fatal) onError('Stream unavailable or geo-blocked');
    });
    currentHls = hls;
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = url;
    video.addEventListener('loadedmetadata', () => { onReady(); video.play().catch(() => {}); }, { once: true });
    video.addEventListener('error', () => onError('Stream failed to load'), { once: true });
  } else {
    video.src = url;
    video.addEventListener('canplay', () => { onReady(); video.play().catch(() => {}); }, { once: true });
    video.addEventListener('error', () => onError('Stream not supported by your browser'), { once: true });
  }
}

// Events
document.getElementById('searchInput').addEventListener('input', applyFilters);
document.getElementById('countryFilter').addEventListener('change', applyFilters);
document.getElementById('catFilter').addEventListener('change', applyFilters);
document.getElementById('dismissBtn').addEventListener('click', () => {
  document.getElementById('errorOverlay').style.display = 'none';
});

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeTab = btn.dataset.tab;
    applyFilters();
  });
});

// Init
(async () => {
  try {
    const channels = await fetchM3U(M3U_URL);
    allChannels = channels;
    document.getElementById('totalTag').textContent = channels.length.toLocaleString() + ' total';
    buildCountryOptions(channels);
    buildCategoryOptions(channels);
    applyFilters();
  } catch (e) {
    document.getElementById('channelList').innerHTML = `
      <div style="padding:32px;text-align:center">
        <div style="font-size:32px;margin-bottom:12px">📡</div>
        <div style="font-family:var(--mono);font-size:12px;color:var(--red);margin-bottom:6px">Failed to load channels</div>
        <div style="font-family:var(--mono);font-size:11px;color:var(--muted)">${e.message}</div>
        <div style="font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:8px">Try opening from a local server or browser with CORS disabled</div>
      </div>
    `;
    document.getElementById('channelCount').textContent = 'Error';
    document.getElementById('totalTag').textContent = 'Failed';
  }
})();
</script>
</body>
</html>
